<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <title>Parcely Jičín</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <style>
      html,
      body,
      #map {
        height: 100%;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
      const map = L.map("map").setView([50.437, 15.352], 18);

      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap contributors",
      }).addTo(map);

      const parcelsLayer = L.geoJSON(null).addTo(map);

      let timer;

      async function loadParcels() {
        if (map.getZoom() < 18) {
          parcelsLayer.clearLayers();
          return;
        }

        const b = map.getBounds();
        const bbox = [
          b.getWest(),
          b.getSouth(),
          b.getEast(),
          b.getNorth(),
        ].join(",");

        const res = await fetch(`/api/parcels?bbox=${bbox}`);

        if (!res.ok) {
          return;
        }

        parcelsLayer.clearLayers();
        parcelsLayer.addData(await res.json());
      }

      map.on("moveend", () => {
        clearTimeout(timer);
        timer = setTimeout(loadParcels, 250);
      });

      loadParcels();
    </script>
  </body>
</html>
